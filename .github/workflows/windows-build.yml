name: Windows desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - uses: astral-sh/setup-uv@v5
      - uses: microsoft/setup-msbuild@v2
      - name: Verify locked dependencies
        run: uv lock --check
      - name: Run Python regression tests
        run: uv run --locked --group test python -m pytest -q tests
      - name: Build unsigned portable package
        shell: pwsh
        run: .\windows\scripts\build-portable.ps1
      - name: Smoke-test frozen CLI and package layout
        shell: pwsh
        run: |
          $stage = Resolve-Path .\artifacts\portable-stage
          $cli = Join-Path $stage 'CLI\BondSealCLI.exe'
          & $cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Frozen CLI help did not start." }
          $request = Join-Path $env:RUNNER_TEMP 'invalid-quick-batch.json'
          [IO.File]::WriteAllText($request,'{"version":1,"files":[]}',[Text.UTF8Encoding]::new($false))
          $output = & $cli collect --request-file $request --json
          if ($LASTEXITCODE -notin @(1,2)) { throw "Frozen CLI returned unexpected code: $LASTEXITCODE" }
          $payload = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($payload.command -ne 'collect') { throw "Frozen CLI returned the wrong command payload." }
          $global:LASTEXITCODE = 0
          $zip = Resolve-Path .\artifacts\BondSealPages-Windows-x64.zip
          $entries = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($name in @('Install.cmd','Install.ps1','Uninstall.cmd','Uninstall.ps1','GUI/BondSealGUI.exe','CLI/BondSealCLI.exe','windows/BondSealContextMenu.dll')) {
              if (-not ($entries.Entries | Where-Object FullName -eq $name)) { throw "Missing ZIP entry: $name" }
            }
          }
          finally { $entries.Dispose() }
      - name: Verify per-user install and uninstall
        shell: pwsh
        run: |
          $stage = Resolve-Path .\artifacts\portable-stage
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $stage 'Install.ps1') -NoPrompt
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell installer failed.' }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\BondSealPages'
          $clsid = '{62C7EB66-A11D-4F91-934C-3DAA9A3EF821}'
          $verbs = @('HKCU:\Software\Classes\SystemFileAssociations\.doc\shell\BondSealCollect','HKCU:\Software\Classes\SystemFileAssociations\.docx\shell\BondSealCollect')
          $server = "HKCU:\Software\Classes\CLSID\$clsid\InprocServer32"
          foreach ($verb in $verbs) {
            if (-not (Test-Path -LiteralPath $verb)) { throw "Explorer verb was not registered: $verb" }
            if ((Get-Item -LiteralPath $verb).GetValue('') -ne '生成签署页合集') { throw 'Explorer menu title encoding is invalid.' }
            if ((Get-ItemPropertyValue -LiteralPath $verb -Name ExplorerCommandHandler) -ne $clsid) { throw 'Explorer command CLSID mismatch.' }
            if ((Get-ItemPropertyValue -LiteralPath $verb -Name MultiSelectModel) -ne 'Player') { throw 'Multi-selection is not enabled.' }
          }
          if (-not (Test-Path -LiteralPath ((Get-Item -LiteralPath $server).GetValue('')))) { throw 'COM DLL path is invalid.' }
          & (Join-Path $root 'bondseal.cmd') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI did not start.' }
          $previous = (Get-Content -LiteralPath (Join-Path $root 'current.txt') -Raw).Trim()
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $stage 'Install.ps1') -NoPrompt
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell upgrade failed.' }
          $current = (Get-Content -LiteralPath (Join-Path $root 'current.txt') -Raw).Trim()
          if ($previous -eq $current) { throw 'Upgrade did not switch versioned directory.' }
          if (Test-Path -LiteralPath (Join-Path $root $previous)) { throw 'Upgrade left an unused versioned directory.' }
          & .\windows\tests\ExplorerCommandState.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'Uninstall.ps1') -NoPrompt
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell uninstaller failed.' }
          if ((@($verbs | Where-Object { Test-Path -LiteralPath $_ }).Count -gt 0) -or (Test-Path -LiteralPath $server)) { throw 'Uninstall left context-menu registration behind.' }
      - name: Upload unsigned portable app
        uses: actions/upload-artifact@v4
        with:
          name: BondSealPages-Windows-x64
          path: artifacts/BondSealPages-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
