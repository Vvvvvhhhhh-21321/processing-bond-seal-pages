[project]
name = "bond-seal-desktop-host"
version = "0.1.0"
description = "Windows desktop host and packaging metadata for bond seal-page collection"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pypdf>=5.0,<7",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
test = [
    "pytest>=8,<10",
]
build = [
    "pyinstaller>=6.10,<7",
    "pyinstaller-hooks-contrib>=2024.10",
]

[tool.uv]
package = false
